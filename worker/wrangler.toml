# Deploy del Worker (workers-rs). Lo ejecuta `wrangler deploy` desde este
# directorio; ver .github/workflows/deploy.yml.
#
# REQUISITOS (ninguno se puede inventar, deben existir en la cuenta):
#   1. Secrets de GitHub: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#   2. Secret del Worker: WEBHOOK_SECRET (el webhook falla cerrado sin él → 503).
#   3. Los ids de MODEL_KV de abajo deben ser reales. Con REPLACE_WITH_* el
#      deploy falla; deploy.yml lo comprueba antes de publicar.
#   4. Variable de repositorio WORKER_URL para el smoke test (opcional).
#
# La NN NO se declara en [wasm_modules]: repair_nn_core se enlaza como crate
# Rust dentro del propio módulo WASM del Worker. repair_nn_wasm queda como
# adaptador para consumidores JS/navegador.

name = "auto-healing-agent-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[kv_namespaces]]
binding = "MODEL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_ID"

# Sin [durable_objects] ni [[r2_buckets]]: no hay bindings en el código.
# Ver docs/DISCREPANCIES.md ítems 9 y 10.