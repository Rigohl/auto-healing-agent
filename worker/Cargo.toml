[package]
name = "auto_healing_worker"
version = "0.2.0"
edition = "2021"
license = "MIT"

# El worker es un paquete de Cloudflare aparte, compilado por worker-build con
# target wasm32-unknown-unknown, no un miembro del workspace de crates/.
# Sin esta tabla vacia, cargo se niega a compilarlo por separado:
#   error: current package believes it's in a workspace when it's not
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# workers-rs 0.8: Durable Objects (#[durable_object] + SqlStorage, SQLite) y
# Queues (feature "queue" + #[event(queue)]) con soporte mantenido.
worker = { version = "0.8", features = ["queue", "http", "axum"] }
# La feature "http" de worker activa transitivamente worker-macros/http
# (worker 0.8: http = ["worker-macros/http"]); NO hace falta declarar
# worker-macros como dependencia directa (cargo-machete la marca sin uso).
# Capa HTTP: Router de Axum (migration del Router legacy de workers-rs).
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pipeline edge. Todos son no_std + alloc, asi que compilan dentro del propio
# modulo WASM del Worker: por eso no hace falta [wasm_modules] en wrangler.toml.
repair_types = { path = "../crates/repair_types", default-features = false }
feature_engine = { path = "../crates/feature_engine", default-features = false }
repair_nn_core = { path = "../crates/repair_nn_core", default-features = false }
repair_operators = { path = "../crates/repair_operators", default-features = false }

# Tamano del binario WASM (guia oficial de Rust Workers:
# developers.cloudflare.com/workers/languages/rust/ - el template de
# workers-rs pre-configura lto, strip y codegen-units = 1; opt-level = "s"
# es la optimizacion extra a tamano de este worker).
[profile.release]
lto = true
opt-level = "s"
# strip = true ELIMINADO (fix 2026-10-05): con --panic-unwind, wasm-bindgen genera
# catch wrappers que necesitan la tabla externref con su simbolo. strip borra ese
# simbolo del WASM y el build falla con "externref table required for catch
# wrappers" (evidencia: PR #33 diag, main 66f930fe). El ahorro de tamano se
# conserva con opt-level = "s" + lto + codegen-units = 1.
codegen-units = 1
