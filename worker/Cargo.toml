[package]
name = "auto_healing_worker"
version = "0.1.0"
edition = "2021"
license = "MIT"

# El worker es un paquete de Cloudflare aparte, compilado por worker-build con
# target wasm32-unknown-unknown, no un miembro del workspace de crates/.
# Sin esta tabla vacía, cargo se niega a compilarlo por separado:
#   error: current package believes it's in a workspace when it's not
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.5"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "s"
