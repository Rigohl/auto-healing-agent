[workspace]
resolver = "2"
members = [
    "crates/repair_types",
    "crates/feature_engine",
    "crates/repair_nn_core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rigohl <auto-healing-agent>"]
repository = "https://github.com/Rigohl/auto-healing-agent"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "1"
