[workspace]
resolver = "2"
members = [
    "crates/repair_types",
    "crates/feature_engine",
    "crates/repair_nn_core",
    "crates/repair_nn_wasm",
    "crates/repair_operators",
    "crates/repair_train",
    "crates/repair_pr",
]
# worker/ is a separate CF package (workers-rs); build via wrangler, not always in workspace tests

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rigohl <auto-healing-agent>"]
repository = "https://github.com/Rigohl/auto-healing-agent"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# no_std math for repair_nn_core: f32::exp() is a std method, unavailable on wasm32-unknown-unknown
libm = "0.2"
