name: fmt-fix
on:
  push:
    branches: [feat/explainability]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt root y worker
        run: |
          cargo fmt --all
          cargo fmt --manifest-path worker/Cargo.toml
      - name: commit si hay cambios
        run: |
          git config user.name "fmt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: cargo fmt (worker) [bot]" && git push)
