name: FMT fix (temporal)

# Workflow TEMPORAL de la rama feat/learning-loop: captura la salida REAL de
# cargo fmt --check, aplica rustfmt y commitea. El output del check va en el
# mensaje del commit (legible via API; los logs de Actions requieren auth).

on:
  push:
    branches: [feat/learning-loop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmt-fix
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/learning-loop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Capturar salida de fmt --check (workspace raiz)
        id: check
        run: |
          set +e
          cargo fmt --all -- --check >/tmp/fmt-ws.txt 2>&1
          echo "ws_exit=$?" >>"$GITHUB_OUTPUT"
          cargo fmt --manifest-path worker/Cargo.toml -- --check >/tmp/fmt-worker.txt 2>&1
          echo "wk_exit=$?" >>"$GITHUB_OUTPUT"
          exit 0
      - name: rustfmt (aplicar)
        run: |
          cargo fmt --all || true
          cargo fmt --manifest-path worker/Cargo.toml || true
      - name: Commit con la evidencia
        run: |
          git config user.name "fmt-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "style: rustfmt auto + evidencia del check"
            echo ""
            echo "workspace --check exit: ${{ steps.check.outputs.ws_exit }}"
            echo "worker --check exit: ${{ steps.check.outputs.wk_exit }}"
            echo "--- workspace check output ---"
            head -c 4000 /tmp/fmt-ws.txt
            echo ""
            echo "--- worker check output ---"
            head -c 2000 /tmp/fmt-worker.txt
          } >/tmp/commit-msg.txt
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -F /tmp/commit-msg.txt
          else
            git commit --allow-empty -F /tmp/commit-msg.txt
          fi
          git push
