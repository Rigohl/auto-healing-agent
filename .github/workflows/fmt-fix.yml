name: FMT fix (temporal)

# Workflow TEMPORAL de la rama feat/devops-research: ejecuta el rustfmt
# real (mismo toolchain que CI) y commitea el resultado. Se elimina de la
# rama en cuanto el arbol queda formateado.

on:
  push:
    branches: [feat/devops-research]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmt-fix
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/devops-research
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt workspace raiz
        run: cargo fmt --all
      - name: rustfmt worker
        run: cargo fmt --manifest-path worker/Cargo.toml
      - name: "Commit si hay cambios"
        run: |
          git config user.name "fmt-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: rustfmt del arbol (auto)"
            git push
          else
            echo "sin cambios de formato"
          fi
