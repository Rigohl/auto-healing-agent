name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --locked -p repair_types -p feature_engine -p repair_nn_core -p repair_operators

  # worker/ is part of the workspace, checked for host and wasm32 targets
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --manifest-path worker/Cargo.toml --all-targets
      - run: cargo check --locked --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: cargo clippy --locked -p repair_types -p feature_engine -p repair_nn_core -p repair_operators --all-targets -- -D warnings
