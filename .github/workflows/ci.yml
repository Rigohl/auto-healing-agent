name: CI

# VERIFY real (docs/GOVERNANCE.md, "Autoridad de VERIFY"). Este workflow ES la
# autoridad de VERIFY del repo y cubre DOS unidades de build separadas:
#   1. El workspace raiz (crates/): los comandos --workspace lo cubren entero.
#   2. worker/: paquete de Cloudflare con su PROPIO [workspace] (DISCREPANCIES
#      item 35). Ningun comando del raiz lo compila: solo
#      --manifest-path worker/Cargo.toml lo alcanza. Sin los jobs worker-*
#      romper el worker dejaria CI en verde.
# No se declara PASS sin estos checks. Branch protection NO los exige hoy
# (ver GOVERNANCE.md, "Merge"): la exigencia es disciplinaria hasta que se
# activen los required checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- workspace raiz (crates/) ----------------
  workspace-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # --workspace: los 6 crates del raiz, incluido repair_nn_wasm (que el
      # listado -p anterior excluía). El worker NO es miembro: jobs worker-*.
      - run: cargo test --workspace

  workspace-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warnings son errores: el set de crates es pequeno para mantenerlo limpio.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Item 34 cerrado (2026-10-03): el arbol se formateo con cargo fmt
  # (workspace raiz + worker/) y --check pasa de advisory a BLOCKING.
  # Rojo = formato divergente: el PR no se mergea. Nunca verde falso.

  workspace-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------------- código huérfano (deps sin uso) ----------------
  # Ninguna tool de Rust ve una dependencia declarada que ningún crate usa:
  # compila igual y queda huérfana. cargo-machete la detecta por texto
  # (rápido; puede dar falsos positivos con macros: en ese caso iterar o
  # documentar), cargo-shear además revisa deps del workspace y avisa de
  # archivos vacíos/sin enlazar. Fail-closed: rojo = deuda real.
  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-machete (deps declaradas sin uso en crates/ y worker/)
        run: |
          cargo install cargo-machete --locked
          cargo machete --version
          cargo machete
      - name: cargo-shear (deps del workspace + archivos sin enlazar)
        run: |
          cargo install cargo-shear --locked
          cargo shear

  # ---------------- worker (artefacto desplegable) ----------------
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "worker -> target"
      # Host: compila todos los targets (tests incluidos).
      - run: cargo check --manifest-path worker/Cargo.toml --all-targets
      # El artefacto que despliega wrangler es un modulo wasm32: probar el
      # host no prueba el deploy; esto es lo que romperia el build de
      # Cloudflare en produccion.
      - run: cargo check --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release
      # Item 34, gap restante (2026-10-03): worker/ es una unidad de build
      # propia y `cargo fmt --all` del raiz no la alcanza (DISCREPANCIES
      # item 34). El arbol del worker se formateo con el mismo toolchain
      # (workflow temporal del PR #24); este check impide que el formato
      # vuelva a divergir en silencio.
      - run: cargo fmt --manifest-path worker/Cargo.toml -- --check

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path worker/Cargo.toml

  worker-clippy:
    runs-on: ubuntu-latest
    # DIAGNOSTICO TEMPORAL (se revierte antes del merge): al fallar, publica
    # la salida de clippy como comentario del PR (auditable sin logs).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (warnings son errores)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          cargo clippy --manifest-path worker/Cargo.toml --all-targets 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E "^(error|warning)" -A 8 /tmp/clippy.log | head -200 > /tmp/clippy_excerpt.txt || true
            {
              echo "### worker-clippy: salida de cargo clippy (diagnostico temporal)"
              echo "~~~"
              cat /tmp/clippy_excerpt.txt
              echo "~~~"
            } > /tmp/clippy_comment.md
            cat /tmp/clippy_comment.md >> "$GITHUB_STEP_SUMMARY" || true
            if [ -n "$PR_NUMBER" ]; then
              gh pr comment "$PR_NUMBER" --body-file /tmp/clippy_comment.md || true
              payload=$(jq -Rs --arg b "$(cat /tmp/clippy_comment.md)" '{ "body": $b }' /dev/null)
              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
                -d "$payload" || true
            fi
            exit 1
          fi

  # ---------------- guard de configuracion (wrangler.toml) ----------------
  # Ningun job validaba wrangler.toml: solo wrangler lo parsea, en el momento
  # del deploy (accion humana). El incidente fb6d59db dejo 4 saltos de linea
  # que rompian el TOML (fix 1f0c66e) y CI seguia verde porque nada lo leia.
  # tomllib (Python 3.11+, en ubuntu-latest) valida el parseo en cada push/PR.
  wrangler-toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: worker/wrangler.toml debe ser TOML valido
        run: |
          python3 -c "import tomllib; tomllib.load(open('worker/wrangler.toml','rb'))"
          echo "wrangler.toml: TOML valido"

  # ---------------- artefacto real de deploy (worker-build) ----------------
  # Auditoria P0: ningun job de CI compilaba el artefacto WASM real; el
  # primer deploy seria la primera prueba de build.sh (incluido
  # --panic-unwind, aplicado sin verificacion previa). Este job ejecuta el
  # MISMO camino de build que el deploy: worker/build.sh instala el
  # toolchain nightly y ejecuta worker-build --release --panic-unwind.
  # Rojo = el deploy romperia.
  worker-build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compilar el artefacto WASM real (worker-build --release --panic-unwind)
        run: bash worker/build.sh
