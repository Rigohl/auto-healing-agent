name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # fmt cubre el workspace raíz. El fmt del worker (paquete aparte con
      # [workspace] propio) queda diferido a P2: requiere pasada con toolchain
      # local antes de activar --check ahí. DISCREPANCIES.md ítem 34.
      - run: cargo fmt -- --check

  # worker/ is deliberately outside the Cargo workspace (separate Cloudflare
  # package built by worker-build), so no workspace command compiles it.
  # Without this job worker/src/lib.rs could break with CI green.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --manifest-path worker/Cargo.toml --all-targets
      # The deployable artifact is a wasm32 module. Checking it for the host
      # target does not prove it builds for Cloudflare, which is what
      # worker-build does at deploy time.
      - run: cargo check --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Warnings are errors: the crate set is small enough to keep clean.
      - run: cargo clippy --workspace --all-targets -- -D warnings
