name: Diag (temporal)

on:
  push:
    branches: [feat/devops-research]
    paths: [".diag"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/devops-research
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: "clippy worker + fmt-check + wasm32 check"
        run: |
          set +e
          cargo clippy --manifest-path worker/Cargo.toml --all-targets -- -D warnings >/tmp/clp.txt 2>&1
          echo "clippy_exit=$?" >>"$GITHUB_ENV"
          cargo fmt --manifest-path worker/Cargo.toml -- --check >/tmp/fmt.txt 2>&1
          echo "fmt_exit=$?" >>"$GITHUB_ENV"
          cargo check --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release >/tmp/w32.txt 2>&1
          echo "w32_exit=$?" >>"$GITHUB_ENV"
          exit 0
      - name: "Commit con la evidencia"
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "diag2: clippy/fmt/wasm32 del worker"
            echo ""
            echo "clippy exit: ${CLIPPY_EXIT}"
            echo "--- clippy output ---"
            grep -v -e "^ *Checking" -e "^ *Compiling" -e "Finished" /tmp/clp.txt | tail -c 3000
            echo ""
            echo "fmt exit: ${FMT_EXIT}"
            echo "--- fmt output ---"
            tail -c 1000 /tmp/fmt.txt
            echo ""
            echo "wasm32 exit: ${W32_EXIT}"
            echo "--- wasm32 output (errores) ---"
            grep -e "^error" -e "^warning" -A 4 /tmp/w32.txt | tail -c 1500 || true
          } >/tmp/commit-msg.txt
          git commit --allow-empty -F /tmp/commit-msg.txt
          git push
