name: Diag (temporal)

# Workflow TEMPORAL de diagnostico (sin issues en el repo): captura la
# salida REAL de wasm-pack test --node y de verify_repo.py y la commitea
# (mensaje legible via API; los logs de Actions requieren auth). Se
# autolimita: solo dispara si cambia el archivo .diag, asi su propio
# commit de evidencia no lo relanza.

on:
  push:
    branches: [feat/learning-loop]
    paths: [".diag"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/learning-loop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: wasm-pack test --node
        id: wasm
        run: |
          set +e
          wasm-pack test --node crates/repair_nn_wasm >/tmp/wasm.txt 2>&1
          echo "wasm_exit=$?" >>"$GITHUB_OUTPUT"
          exit 0
      - name: verify_repo.py
        id: verify
        run: |
          set +e
          python3 scripts/verify_repo.py --out /tmp/ev.json >/tmp/verify.txt 2>&1
          echo "verify_exit=$?" >>"$GITHUB_OUTPUT"
          exit 0
      - name: verify_repo.py
        id: verify
        run: |
          set +e
          python3 scripts/verify_repo.py --out /tmp/ev.json >/tmp/verify.txt 2>&1
          echo "verify_exit=$?" >>"$GITHUB_OUTPUT"
          echo "verify_bytes=$(wc -c </tmp/verify.txt)" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Commit con la evidencia
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "diag2: output completo de verify"
            echo ""
            echo "verify exit: ${{ steps.verify.outputs.verify_exit }} bytes: ${{ steps.verify.outputs.verify_bytes }}"
            echo "--- verify.txt (tail) ---"
            tail -c 3500 /tmp/verify.txt
            echo ""
            echo "--- refs origin ---"
            git for-each-ref --format="%(refname)" refs/remotes/origin || true
          } >/tmp/commit-msg.txt
          git commit --allow-empty -F /tmp/commit-msg.txt
          git push
