name: Diag (temporal)

# Workflow TEMPORAL (sin issues): aplica la politica de una sola rama
# (docs/BRANCH_POLICY.md) borrando la rama extraviada feat/real-learning-loop
# (intento paralelo superseded por el PR #132) y commitea la evidencia de
# verify. Autolimitado: solo dispara si cambia .diag.

on:
  push:
    branches: [feat/learning-loop]
    paths: [".diag"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/learning-loop
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Borrar rama extraviada (politica: solo main persiste)
        run: |
          set +e
          git push origin --delete feat/real-learning-loop >/tmp/branch-del.txt 2>&1
          echo "del_exit=$?" >>"$GITHUB_ENV"
          exit 0
      - name: verify_repo.py
        id: verify
        run: |
          set +e
          python3 scripts/verify_repo.py --out /tmp/ev.json >/tmp/verify.txt 2>&1
          echo "verify_exit=$?" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Commit con la evidencia
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "diag3: limpieza de rama + verify"
            echo ""
            echo "branch delete exit: ${DEL_EXIT}"
            tail -n 3 /tmp/branch-del.txt
            echo ""
            echo "verify exit: ${{ steps.verify.outputs.verify_exit }}"
            echo "--- verify.txt (tail 1200) ---"
            tail -c 1200 /tmp/verify.txt
          } >/tmp/commit-msg.txt
          git commit --allow-empty -F /tmp/commit-msg.txt
          git push
