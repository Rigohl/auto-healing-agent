name: Diag (temporal)

# Workflow TEMPORAL de diagnostico (sin issues): captura el output completo
# de verify_repo.py y lo commitea. Autolimitado: solo dispara si cambia .diag.

on:
  push:
    branches: [feat/learning-loop]
    paths: [".diag"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/learning-loop
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: verify_repo.py
        id: verify
        run: |
          set +e
          python3 scripts/verify_repo.py --out /tmp/ev.json >/tmp/verify.txt 2>&1
          echo "verify_exit=$?" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Commit con la evidencia
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "diag2: output completo de verify"
            echo ""
            echo "verify exit: ${{ steps.verify.outputs.verify_exit }}"
            echo "--- verify.txt (tail 3500 bytes) ---"
            tail -c 3500 /tmp/verify.txt
            echo ""
            echo "--- refs origin ---"
            git for-each-ref --format="%(refname)" refs/remotes/origin || true
          } >/tmp/commit-msg.txt
          git commit --allow-empty -F /tmp/commit-msg.txt
          git push
