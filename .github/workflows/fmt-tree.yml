name: FMT tree (temporal)

# Ejecuta `cargo fmt` sobre el árbol y commitea el resultado en ESTA rama
# (patrón del workflow diag-tests del PR #22: se elimina antes del PR).
# Cierra la deuda de formato del item 34 de DISCREPANCIES para que el job
# `workspace-fmt` de ci.yml pueda pasar de advisory a blocking.
# Los pasos de toolchain/rustfmt replican EXACTOS los del job workspace-fmt
# de ci.yml (rust-toolchain.toml pinnea channel = "stable"): así lo que
# commitea este workflow es idéntico a lo que exigirá --check.
on:
  push:
    branches: [chore/rustfmt-tree]

permissions:
  contents: write

concurrency:
  group: fmt-tree
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Workspace raiz (7 crates) y unidad separada worker/ (item 35):
      # el check de ci.yml solo ve el raiz, pero se formatean los dos para
      # que ningun subarbol quede con deuda.
      - run: cargo fmt --all
      - run: cargo fmt --manifest-path worker/Cargo.toml
      - name: Commitear el árbol formateado
        run: |
          git config user.name "fmt-tree-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::nada que formatear (árbol ya formateado)"
          else
            git commit -m "style: cargo fmt --all en workspace y worker (cierra item 34)"
            git push
          fi
