name: cleanup-now (temporal)

# Ejecucion inmediata de docs/BRANCH_POLICY.md: solo main persiste. Borra
# toda rama != main (incluida la efimera de la PR #132 ya fusionada) y
# despues se autodestruye (se borra a si mismo del arbol).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cleanup-now
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: "Borrar toda rama que no sea main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api --paginate "repos/Rigohl/auto-healing-agent/branches?per_page=100" \
            | jq -r '.[].name' \
            | grep -v '^main$' \
            | while read -r branch; do
                echo "deleting ${branch}"
                gh api -X DELETE "repos/Rigohl/auto-healing-agent/git/refs/heads/${branch}" || true
              done
      - name: "Autodestruir este workflow"
        run: |
          git config user.name "cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/cleanup-now.yml
          git commit -m "chore: autodestruye cleanup-now (politica una sola rama aplicada)"
          git push
