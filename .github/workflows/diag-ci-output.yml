name: Diag CI output (temporal)

# TEMPORAL: publica la salida de test/clippy/fmt en un issue para
# diagnostico. Borrar cuando el arbol este verde.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: diag-ci-output
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: workspace test
        run: |
          cargo test --workspace > /tmp/t.log 2>&1 || true
          echo "exit=$?" >> /tmp/t.log
      - name: workspace clippy
        run: |
          cargo clippy --workspace --all-targets \
            -- -D warnings > /tmp/c.log 2>&1 || true
          echo "exit=$?" >> /tmp/c.log
      - name: workspace fmt
        run: |
          cargo fmt --all -- --check > /tmp/f.log 2>&1 || true
          echo "exit=$?" >> /tmp/f.log
      - name: worker clippy
        run: |
          cargo clippy --manifest-path worker/Cargo.toml \
            --all-targets -- -D warnings > /tmp/wc.log 2>&1 || true
          echo "exit=$?" >> /tmp/wc.log
      - name: worker fmt
        run: |
          cargo fmt --manifest-path worker/Cargo.toml \
            -- --check > /tmp/wf.log 2>&1 || true
          echo "exit=$?" >> /tmp/wf.log
      - name: post output issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Diag CI output @ $GITHUB_SHA"
            for pair in "workspace-test:t" \
                "workspace-clippy:c" "workspace-fmt:f" \
                "worker-clippy:wc" "worker-fmt:wf"; do
              name="${pair%%:*}"
              key="${pair##*:}"
              echo ""
              echo "## $name"
              echo "```"
              tail -c 9000 "/tmp/$key.log" || true
              echo "```"
            done
          } > /tmp/body.md
          gh issue create \
            --title "diag-ci-output ${GITHUB_SHA:0:7}" \
            --body-file /tmp/body.md
