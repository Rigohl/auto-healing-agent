name: Diag CI output (temporal)

# TEMPORAL: publica la salida de test/clippy/fmt en un issue.
# Borrar cuando el arbol este verde.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: diag-ci-output
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: workspace test
        run: |
          cargo test --workspace > /tmp/t.log 2>&1 || true
      - name: workspace clippy
        run: |
          cargo clippy --workspace --all-targets \
            -- -D warnings > /tmp/c.log 2>&1 || true
      - name: workspace fmt
        run: |
          cargo fmt --all -- --check > /tmp/f.log 2>&1 || true
      - name: worker clippy
        run: |
          cargo clippy --manifest-path worker/Cargo.toml \
            --all-targets -- -D warnings > /tmp/wc.log 2>&1 || true
      - name: worker fmt
        run: |
          cargo fmt --manifest-path worker/Cargo.toml \
            -- --check > /tmp/wf.log 2>&1 || true
      - name: consistency verify
        run: |
          git fetch --depth=0 origin +refs/heads/*:refs/remotes/origin/* \
            || true
          python3 scripts/verify_repo.py > /tmp/v.log 2>&1 || true
      - name: assemble and post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/mkbody.py <<"PYEOF"
          import os
          parts = []
          for name, key in [
              ("workspace-test", "t"),
              ("workspace-clippy", "c"),
              ("workspace-fmt", "f"),
              ("worker-clippy", "wc"),
              ("worker-fmt", "wf"),
              ("consistency-verify", "v"),
          ]:
              try:
                  with open("/tmp/%s.log" % key) as fh:
                      t = fh.read()
              except OSError:
                  t = "log missing"
              parts.append("## %s" % name)
              parts.append("~~~")
              parts.append(t[-9000:])
              parts.append("~~~")
          body = "\n\n".join(parts)[:60000]
          with open("/tmp/body.md", "w") as fh:
              fh.write(body)
          PYEOF
          python3 /tmp/mkbody.py
          gh issue create \
            --title "diag-ci-output ${GITHUB_SHA:0:7}" \
            --body-file /tmp/body.md
