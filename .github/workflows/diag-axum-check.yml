name: diag-axum-check

# TEMPORAL (se borra antes del merge del PR #82): publica el output de
# cargo check / clippy / fmt del worker en un issue para diagnosticar el
# fallo de CI. Los endpoints de logs de la API de Actions no exponen el
# output via proxy sin auth.
on:
  push:
    branches: [feat/axum-router]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Recolectar output
        run: |
          {
            echo '## diag-axum-check @' "$GITHUB_SHA"
            echo '### cargo check host'
            echo '```'
            cargo check --manifest-path worker/Cargo.toml --all-targets 2>&1 || true
            echo '```'
            echo '### cargo check wasm32'
            echo '```'
            cargo check --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release 2>&1 | tail -n 120 || true
            echo '```'
            echo '### cargo clippy'
            echo '```'
            cargo clippy --manifest-path worker/Cargo.toml --all-targets 2>&1 || true
            echo '```'
            echo '### cargo fmt check'
            echo '```'
            cargo fmt --manifest-path worker/Cargo.toml -- --check 2>&1 || true
            echo '```'
          } > /tmp/diag.md
      - name: Publicar issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/diag.md', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'diag-axum-check ' + context.sha.slice(0, 8),
              body,
            });
