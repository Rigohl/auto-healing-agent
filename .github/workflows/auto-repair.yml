name: Auto-Repair (DISABLED legacy LLM)

# Path canónico = Rust crates + worker/ + CI verify.
# legacy/agent.ts NO se ejecuta. Conservado solo como archivo de archivo.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "This workflow no longer runs the HF agent. Use cargo CI + worker Rust."
        required: false
        default: "rust-only"

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Rust-only policy
        run: |
          echo "LLM free-form codegen path is disabled."
          echo "Core: crates/repair_* + worker/ (Rust/WASM)."
          echo "VERIFY authority: .github/workflows/ci.yml and wasm.yml"
