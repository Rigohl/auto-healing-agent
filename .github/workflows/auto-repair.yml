name: Auto-Repair (Disabled Legacy)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "This workflow no longer runs free-form LLM code generation. Deterministic repair operators apply."
        required: false
        default: "rust-only"

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Enforcement Notice
        run: |
          echo "LLM free-form codegen path is disabled."
          echo "Core: crates/repair_* + worker/ (Rust/WASM)."
          echo "VERIFY authority: .github/workflows/ci.yml and repair-validation.yml"
