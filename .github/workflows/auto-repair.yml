name: Retrain NN (manual)

# Reemplaza al antiguo "Auto-Repair (DISABLED legacy LLM)": da uso real al
# crate repair_train (antes sin consumidor) en un flujo seguro. Re-entrena
# la red V1 y publica el payload KV como artefacto de Actions para
# inspeccion humana; la promocion a MODEL_KV sigue siendo un paso aparte
# (promote-model.yml) y la escritura en produccion sigue bajo dispatch
# humano (docs/GOVERNANCE.md: PRODUCTION_WRITE). Umbral interno del
# trainer: accuracy >= 0.90, si no no escribe el artefacto (fail-closed).

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Motivo del re-entrenamiento (queda en el run)"
        required: false
        default: "retrain"

permissions:
  contents: read

concurrency:
  group: retrain-nn
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Loop de aprendizaje real (2026-10-08): vuelca los
      # TrainingExample verificados (training_example:*) de REPAIR_CASES_KV
      # a JSONL y los mezcla con el dataset sintetico. Best-effort: sin
      # credenciales o sin ejemplos, entrena solo sintetico (V1 intacto).
      - name: Dump de ejemplos reales (REPAIR_CASES_KV, best-effort)
        id: examples
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          NS="996211a015f14c54b85ea4b47e79fdf9"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "sin CLOUDFLARE_API_TOKEN: entrenamiento solo sintetico"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : > /tmp/examples.jsonl
          n=0
          for key in $(npx wrangler@4 kv key list --namespace-id "$NS" 2>/dev/null | jq -r '.[].name' | grep '^training_example:'); do
            if npx wrangler@4 kv key get "$key" --namespace-id "$NS" 2>/dev/null >> /tmp/examples.jsonl; then
              echo >> /tmp/examples.jsonl
              n=$((n+1))
            fi
          done
          echo "ejemplos reales: $n"
          if [ "$n" -gt 0 ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Entrenar y validar (accuracy >= 0.90)
        run: |
          set -euo pipefail
          if [ "${{ steps.examples.outputs.empty }}" = "false" ]; then
            cargo run -p repair_train --release -- --out /tmp/current.txt --examples /tmp/examples.jsonl
          else
            cargo run -p repair_train --release -- --out /tmp/current.txt
          fi

      - name: Preflight del artefacto
        run: |
          set -euo pipefail
          n=$(wc -w < /tmp/current.txt)
          if [ "$n" -ne 2863 ]; then
            echo "::error::payload con $n tokens, se esperan 2863 (WEIGHT_COUNT)"
            exit 1
          fi
          echo "OK: 2863 tokens"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nn-payload
          path: /tmp/current.txt
          if-no-files-found: error
