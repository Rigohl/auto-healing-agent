name: diag-worker-check
on:
  push:
    branches: [fix/reland-param-derive-64]
permissions:
  contents: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --manifest-path worker/Cargo.toml --all-targets 2>&1 | tee /tmp/check.log || true
      - run: cargo fmt --manifest-path worker/Cargo.toml -- --check 2>&1 | tee /tmp/fmt.log || true
      - name: Post to issue
        run: |
          {
            echo "diag-worker-check @${GITHUB_SHA}"
            echo '```'
            cat /tmp/check.log
            echo '```'
            echo '```'
            cat /tmp/fmt.log
            echo '```'
          } > /tmp/body.md
          gh issue create --title "diag-worker-check ${GITHUB_SHA::7}" --body-file /tmp/body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
