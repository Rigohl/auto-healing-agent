name: Diag workspace (temporal)

# TEMPORAL: publica el output exacto de fmt/clippy/test del workspace como
# comentario del PR porque los logs de Actions requieren auth de admin.
# ElIMINAR este workflow en el commit que arregle los rojos.

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Diagnostico fmt+clippy+test (workspace)
        run: |
          set +e
          {
            echo "### cargo fmt --all -- --check (workspace)"
            cargo fmt --all -- --check 2>&1
            echo "EXIT_FMT=$?"
            echo "### cargo clippy --workspace --all-targets -- -D warnings"
            cargo clippy --workspace --all-targets -- -D warnings 2>&1
            echo "EXIT_CLIPPY=$?"
            echo "### cargo test --workspace"
            cargo test --workspace 2>&1
            echo "EXIT_TEST=$?"
          } > diag.txt

      - name: Comentar el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diag.txt', 'utf8');
            const sha = context.payload.pull_request.head.sha.slice(0, 8);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '## Diag workspace fmt+clippy+test (temporal, commit ' + sha + ')\n\n```\n' + body.slice(0, 55000) + '\n```'
            });
