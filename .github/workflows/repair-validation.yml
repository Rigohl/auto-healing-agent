name: Repair Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Verify Formatting
        run: cargo fmt --all -- --check
      - name: Verify Workspace Tests
        run: cargo test --all
      - name: Verify Clippy Warnings
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Verify WASM Build
        run: cargo build -p repair_nn_wasm --release --target wasm32-unknown-unknown
      - name: Verify Worker Target
        run: cargo check --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release
