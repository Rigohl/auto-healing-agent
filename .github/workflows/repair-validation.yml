name: Repair Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-validation-${{ github.ref }}
  cancel-in-progress: true

# Este workflow NO es la autoridad de VERIFY: eso es .github/workflows/ci.yml
# (docs/GOVERNANCE.md, "Autoridad de VERIFY"). Este es un gate de PR mas
# explicito: falla antes de la revision humana si el arbol no compila, no pasa
# clippy o no produce el artefacto WASM. Deliberadamente NO duplica los jobs
# `worker-*` de ci.yml: si los duplicara aqui, cualquier CHECK REQUIRED futuro
# apuntaria a dos checks que fallan por razones distintas.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Clippy sin warnings (workspace raiz)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests del workspace raiz
        run: cargo test --workspace

      # Item 34 cerrado (2026-10-03): el arbol esta formateado y este paso
      # pasa a BLOCKING, espejo de workspace-fmt en ci.yml. El advisory
      # quedo huerfano cuando ci.yml dejo de tener continue-on-error:
      # nunca verde falso, nunca advisory en silencio.
      - name: rustfmt (blocking, espejo de ci.yml)
        run: cargo fmt --all -- --check

      - name: Artefacto WASM de repair_nn_wasm
        run: cargo build -p repair_nn_wasm --release --target wasm32-unknown-unknown

      # Puente de evidencia (docs/DEAD_CODE_AUDIT.md): el CLI repair-pr diff
      # deja de ser huerfano al verificarse en cada PR sobre un fixture. CI
      # comprueba que el generador de evidencia offline sigue produciendo el
      # bundle unificado que el contrato (CONTRACT.md 3) exige.
      - name: repair-pr diff sobre fixture (puente de evidencia)
        run: |
          cat > /tmp/changes.json <<'JSON'
          {"files": [{"path": "src/demo.ts", "before": "import x from \"../old/path\";\n", "after": "import x from \"../new/path\";\n"}]}
          JSON
          bundle=$(cargo run -p repair_pr --release -- diff /tmp/changes.json)
          echo "$bundle"
          echo "$bundle" | grep -F '+++ b/src/demo.ts'
          echo "OK: repair-pr diff produce el bundle de evidencia"

 
      - name: Target de despliegue del worker (wasm32, release)
        run: cargo check --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --release

      # El invariant del proyecto, comprobado y no solo escrito: la confianza
      # de la NN nunca es PASS. Si alguien borra el gate o sus umbrales, esto
      # se pone rojo antes que el reviewer.
      - name: El gate sigue fail-closed (0.55 / 0.45)
        run: |
          set -euo pipefail
          grep -q "pub const MIN_CONFIDENCE: f32 = 0.55;" worker/src/worker/mod.rs
          grep -q "pub const MAX_RISK: f32 = 0.45;" worker/src/worker/mod.rs
          grep -q "MIN_CONFIDENCE=0.55" docs/GOVERNANCE.md
          grep -q "MAX_RISK=0.45" docs/GOVERNANCE.md
          echo "OK: umbrales de gate sincronizados entre runtime y GOVERNANCE.md"
