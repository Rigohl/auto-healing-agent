name: Repository Consistency & Drift Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Deterministic Repo Consistency Checker
        run: python3 scripts/verify_repo.py
      - name: Upload Verification Evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: docs/verification_evidence.json
