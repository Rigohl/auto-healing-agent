name: Diag tests (temporal)

# WORKFLOW TEMPORAL DE DIAGNOSTICO — se elimina en el commit que arregle el
# fallo (mismo patron que da03177, retirado en 8ac5ea0). Motivo (PR #22):
# workspace-test / workspace-clippy / validate / Cargo Audit fallan (exit
# 101 / 1), los logs de Actions requieren login y la API de anotaciones
# esta rate-limiteada. Este workflow re-ejecuta los mismos comandos y
# publica las lineas de fallo como COMENTARIO del PR. No es autoridad de
# VERIFY (eso es ci.yml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diag-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build con salida capturada
        continue-on-error: true
        run: cargo build --workspace 2>&1 | tee build-output.log
      - name: Tests con salida capturada
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tee test-output.log
      - name: Clippy con salida capturada
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy-output.log
      - name: Audit con salida capturada
        continue-on-error: true
        run: |
          cargo install cargo-audit --version 0.22.1 --locked 2>&1 | tail -1
          cargo generate-lockfile 2>&1 | tee lock-output.log
          cargo audit 2>&1 | tee audit-output.log
      - name: Fallos como comentario del PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat build-output.log test-output.log clippy-output.log lock-output.log audit-output.log > all-output.log 2>/dev/null || true
          grep -E "panicked|FAILED|failures:|assertion|left:|right:|test result|^error|^warning: unused|Crate |Version |Title |Date |ID: |Solution|Severity|unmaintained|vulnerability found|yanked|does not|expected|cannot find|no method" all-output.log > hits.txt || true
          {
            echo "### Diag (temporal) — lineas de fallo de cargo build/test/clippy/audit"
            echo
            if [ -s hits.txt ]; then
              echo '~~~text'
              head -c 24000 hits.txt
              echo
              echo '~~~'
            else
              echo "sin coincidencias de fallo en los logs"
            fi
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
