name: Diag tests (temporal)

# WORKFLOW TEMPORAL DE DIAGNOSTICO — se elimina en el commit que arregle el
# fallo (mismo patron que da03177, retirado en 8ac5ea0). Motivo (PR #22):
# workspace-test / workspace-clippy / validate / Cargo Audit fallan (exit
# 101 / 1) y los logs de Actions requieren login. Este workflow re-ejecuta
# los mismos comandos y expone las lineas de fallo como ANOTACIONES del
# check run, que si son legibles via API publica. No es autoridad de VERIFY
# (eso es ci.yml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diag-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests con salida capturada
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tee test-output.log
      - name: Clippy con salida capturada
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy-output.log
      - name: Audit con salida capturada
        continue-on-error: true
        run: |
          cargo install cargo-audit --version 0.22.1 --locked 2>&1 | tail -1
          cargo generate-lockfile 2>&1 | tee lock-output.log
          cargo audit 2>&1 | tee audit-output.log
      - name: Fallos como anotaciones
        if: always()
        run: |
          cat test-output.log clippy-output.log lock-output.log audit-output.log > all-output.log 2>/dev/null || true
          grep -E "panicked|FAILED|failures:|assertion|left:|right:|test result|^error|^warning: unused|Crate |Version |Title |Date |ID: |Solution|Severity|unmaintained|vulnerability found|yanked" all-output.log > hits.txt || true
          if [ -s hits.txt ]; then
            while IFS= read -r line; do
              short=$(printf '%s' "$line" | cut -c1-220)
              echo "::error::${short}"
            done < hits.txt
          else
            echo "::notice::sin coincidencias de fallo en los logs"
          fi
