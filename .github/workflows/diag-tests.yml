name: Diag tests (temporal)

# WORKFLOW TEMPORAL DE DIAGNOSTICO — se elimina en el commit que arregle el
# fallo (mismo patron que da03177, retirado en 8ac5ea0). Motivo (PR #22):
# los logs de Actions requieren login y la API de anotaciones esta
# rate-limiteada. Este workflow re-ejecuta los mismos comandos que ci.yml y
# security.yml y publica las lineas de fallo como COMENTARIO del PR. No es
# autoridad de VERIFY (eso es ci.yml + security.yml).
#
# v2: salida sin codigos ANSI (el grep de la v1 no veia las lineas de error
# ni Crate: por los colores de cargo) y cadena de dependencias del crate que
# dispare el audit via cargo tree -i.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diag-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: Build con salida capturada (sin ANSI)
        continue-on-error: true
        run: cargo build --workspace 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee build-output.log
      - name: Tests con salida capturada (sin ANSI)
        continue-on-error: true
        run: cargo test --workspace 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee test-output.log
      - name: Clippy con salida capturada (sin ANSI)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee clippy-output.log
      - name: Audit con salida capturada (sin ANSI)
        continue-on-error: true
        run: |
          cargo install cargo-audit --version 0.22.1 --locked 2>&1 | tail -1
          cargo generate-lockfile 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee lock-output.log
          cargo audit 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee audit-output.log
      - name: Cadena de dependencias del crate marcado por el audit
        continue-on-error: true
        run: |
          : > tree-output.log
          for crate in $(grep -oP '^Crate:[[:space:]]+\K\S+' audit-output.log || true); do
            echo "=== cargo tree -i $crate ===" >> tree-output.log
            cargo tree -i "$crate" >> tree-output.log 2>&1 || echo "(no invertible o no presente)" >> tree-output.log
          done
      - name: Fallos como comentario del PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat build-output.log test-output.log clippy-output.log lock-output.log audit-output.log tree-output.log > all-output.log 2>/dev/null || true
          grep -E "panicked|FAILED|failures:|assertion|left:|right:|test result|^error|^warning: unused|Crate:|Version:|Title:|Date:|ID: |Solution|Severity|unmaintained|vulnerability found|yanked|does not|expected|cannot find|no method|No fixed upgrade" all-output.log > hits.txt || true
          {
            echo "### Diag (temporal) v2 — lineas de fallo de cargo build/test/clippy/audit"
            echo
            if [ -s hits.txt ]; then
              echo '~~~text'
              head -c 24000 hits.txt
              echo
              echo '~~~'
            else
              echo "sin coincidencias de fallo en los logs"
            fi
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
