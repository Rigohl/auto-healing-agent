name: Diag tests (temporal)

# WORKFLOW TEMPORAL DE DIAGNOSTICO — se elimina en el commit que arregle el
# fallo. Motivo: los logs de Actions requieren login y el paso
# `cargo test --workspace` de ci.yml falla con exit 101 (panic de test) sin
# decir QUE test. Este workflow re-ejecuta los mismos tests y expone las
# lineas de fallo como ANOTACIONES del check run, que si son legibles via
# API publica. No es autoridad de VERIFY (eso es ci.yml).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: diag-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests con salida capturada
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tee test-output.log
      - name: Fallos como anotaciones
        if: always()
        run: |
          grep -E "panicked|FAILED|failures:|assertion|left:|right:|test result|^error" test-output.log > hits.txt || true
          if [ -s hits.txt ]; then
            while IFS= read -r line; do
              short=$(printf '%s' "$line" | cut -c1-220)
              echo "::error::${short}"
            done < hits.txt
          else
            echo "::notice::sin coincidencias de fallo en el log de cargo test"
          fi
