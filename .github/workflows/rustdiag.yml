name: RustDiag

# Workflow TEMPORAL de diagnostico (precedente: issues de diag del repo).
# Corre cargo check en worker/ y publica el output en un issue para
# depurar CI sin acceso a los logs. BORRAR tras el diagnostico.

on:
  push:
    branches: [feat/kv-adoption]

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check worker (all targets)
        run: |
          set +e
          cargo check --manifest-path worker/Cargo.toml --all-targets > /tmp/out.log 2>&1
          echo "exit_code=$?" >> /tmp/out.log
          exit 0
      - name: Publicar diagnostico en issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(mktemp)
          {
            echo "Diagnostico automatico de rustc para `feat/kv-adoption` (commit ${GITHUB_SHA}). Workflow temporal: borrar tras el diagnostico."
            echo '~~~'
            head -c 18000 /tmp/out.log
            echo '~~~'
          } > "$BODY"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Diag rustc feat/kv-adoption" --body-file "$BODY" || echo "issue create failed"
