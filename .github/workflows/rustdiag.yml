name: rustdiag

# Diagnostico MANUAL de compilacion del worker (workflow_dispatch).
# TEMPORAL (feat/code-repair): tambien se dispara en push de esta rama para
# publicar el diff exacto de cargo fmt --all en el resumen del run.
# Publica el output de cargo check/fmt en el resumen del run; no crea
# issues. Se restaurara a workflow_dispatch-only antes del merge.

on:
  workflow_dispatch:
  push:
    branches: [feat/code-repair]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check 2>&1 | tee check.log || true
      - run: cargo check --workspace --all-targets 2>&1 | tail -n 80 | tee -a check.log || true
      - name: resumen
        run: |
          {
            echo "### rustdiag output"
            echo "~~~"
            tail -n 200 check.log
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
