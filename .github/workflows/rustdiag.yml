name: rustdiag

# Diagnostico MANUAL de compilacion del worker (workflow_dispatch).
# TEMPORAL (feat/code-repair): tambien se dispara en push de esta rama y
# publica el diff de cargo fmt --all y el tail de cargo check en un ISSUE
# (legible via API anonima). Se restaurara a workflow_dispatch-only antes
# del merge.

on:
  workflow_dispatch:
  push:
    branches: [feat/code-repair]

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check 2>&1 | tee check.log || true
      - run: cargo check --workspace --all-targets 2>&1 | tail -n 100 | tee -a check.log || true
      - name: resumen
        run: |
          {
            echo "### rustdiag output"
            echo '~~~'
            tail -n 200 check.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publicar issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "rustdiag output" --body-file check.log || true
