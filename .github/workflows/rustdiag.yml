name: RustDiag

# TEMPORAL: publica el diff de cargo fmt --check de worker/ en un issue.
# BORRAR tras el diagnostico.

on:
  push:
    branches: [feat/kv-adoption]

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt check worker
        run: |
          set +e
          cargo fmt --manifest-path worker/Cargo.toml -- --check > /tmp/out.log 2>&1
          echo "exit_code=$?" >> /tmp/out.log
          exit 0
      - name: Publicar diagnostico en issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(mktemp)
          {
            echo "Diag fmt (commit ${GITHUB_SHA}). Workflow temporal: borrar tras el diagnostico."
            echo '~~~'
            head -c 20000 /tmp/out.log
            echo '~~~'
          } > "$BODY"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Diag fmt feat/kv-adoption" --body-file "$BODY" || echo "issue create failed"
