name: WASM
on:
  push:
    paths:
      - "crates/repair_nn_wasm/**"
      - "crates/repair_nn_core/**"
      - "crates/repair_types/**"
      # Ambos entran en la cadena edge -> WASM; antes un cambio aquí no
      # disparaba el build (DISCREPANCIES.md 27).
      - "crates/feature_engine/**"
      - "crates/repair_operators/**"
      - "worker/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked -p repair_nn_wasm --release --target wasm32-unknown-unknown
