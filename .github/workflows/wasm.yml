name: WASM
on:
  push:
    paths: ["crates/repair_nn_wasm/**", "crates/repair_nn_core/**", "crates/repair_types/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p repair_nn_wasm --release --target wasm32-unknown-unknown
