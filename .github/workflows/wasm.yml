name: WASM
on:
  push:
    paths:
      - "crates/repair_nn_wasm/**"
      - "crates/repair_nn_core/**"
      - "crates/repair_types/**"
      # Ambos entran en la cadena edge -> WASM; antes un cambio aquí no
      # disparaba el build (DISCREPANCIES.md 27).
      - "crates/feature_engine/**"
      - "crates/repair_operators/**"
      - "worker/**"
  # Sin esto el artefacto WASM solo se construia en el push a main: un PR que
  # rompia repair_nn_core se enteraba al mergear, no al abrirlo.
  pull_request:
    paths:
      - "crates/repair_nn_wasm/**"
      - "crates/repair_nn_core/**"
      - "crates/repair_types/**"
      - "crates/feature_engine/**"
      - "crates/repair_operators/**"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p repair_nn_wasm --release --target wasm32-unknown-unknown
      # Consumidor real de la frontera JS (tests/js_boundary.rs): ejecuta
      # los tests wasm-bindgen en Node con el payload comprometido en
      # model/current.txt (fromWeights/predictFromFeatures/weightCount/
      # featureDim/operator_name). Practica recomendada del toolchain
      # rustwasm: wasm-pack test valida el contrato real del modulo.
      - name: wasm-bindgen tests (Node)
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          wasm-pack test --node crates/repair_nn_wasm
