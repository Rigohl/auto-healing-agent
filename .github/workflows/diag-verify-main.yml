name: diag-verify-main

# TEMPORAL: publica los claims FAIL de verify_repo.py en un issue para
# diagnosticar el rojo de Consistency en main tras el merge del PR #82.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_repo.py --out /tmp/ev.json || true
      - name: Publicar claims fallando
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/ev.json', 'utf8');
              const fails = body.split('\n').filter(l => /FAIL|false|failed/.test(l));
              body = 'Claims con rojo:\n' + (fails.join('\n') || 'ninguno') + '\n\n---JSON completo (recortado)---\n' + body.slice(0, 40000);
            } catch (e) { body = 'no evidence: ' + e.message; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'diag-verify-main ' + context.sha.slice(0, 8),
              body,
            });
