name: Promote model to KV

# GOVERNANCE.md: AUTO_DEPLOY=false, PRODUCTION_WRITE solo bajo dispatch
# humano (Run workflow). Sube model/current.txt (payload KV, 2863 f32)
# a MODEL_KV en las claves model/current (con respaldo previo del current actual en model/rollback; BUG-07: subir el mismo payload a current y stable anulaba el fallback). Con esto el
# Worker puede cargar la red (antes: blocked_no_model). Requiere los
# secrets CLOUDFLARE_API_TOKEN (Workers KV Storage: Edit) y
# CLOUDFLARE_ACCOUNT_ID. Alternativa sin setup: dashboard de Cloudflare
# (KV -> MODEL_KV -> Add entry) pegando el contenido de model/current.txt.
#
# Aprendizaje real (PART4, loop cerrado): con retrain=true y
# export_examples=true se exportan los TrainingExample VERIFICADOS de
# REPAIR_CASES_KV (training_example:*) y el re-entrenamiento mezcla esa
# senal real con el dataset sintetico (repair-train --examples). Solo la
# senal verificada positiva entra al entrenamiento; la promocion sigue
# siendo humana.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kv_namespace_id:
        description: "Namespace ID de MODEL_KV"
        required: true
        default: "73014a1b32b7446397461a8d438c8ab2"
      keys:
        description: "Claves destino (separadas por espacio; por defecto solo model/current)"
        required: true
        default: "model/current"
      retrain:
        description: "Re-entrenar la NN con repair_train antes de promover"
        required: false
        default: false
        type: boolean
      export_examples:
        description: "Exportar TrainingExample* de REPAIR_CASES_KV y entrenar con ellos (requiere retrain)"
        required: false
        default: false
        type: boolean
      also_candidate:
        description: "Ademas subir el payload a NN_WEIGHTS:model/candidate (challenger)"
        required: false
        default: false
        type: boolean
      promote_stable:
        description: "Ademas promocionar el current PREVIO (validado) a model/stable: el fallback current->stable del worker deja de ser teorico"
        required: false
        default: false
        type: boolean

concurrency:
  group: promote-model-kv
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Cierra el loop champion/challenger con el crate repair_train (antes
      # sin consumidor): el re-entrenamiento es parte del mismo flujo humano
      # de promocion, nunca automatico. Umbral interno: accuracy >= 0.90.
      - name: Toolchain Rust (solo retrain)
        if: ${{ inputs.retrain }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de cargo (solo retrain)
        if: ${{ inputs.retrain }}
        uses: Swatinem/rust-cache@v2

      - name: Exportar ejemplos reales de REPAIR_CASES_KV (opcional)
        if: ${{ inputs.retrain && inputs.export_examples }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS_CASES: "996211a015f14c54b85ea4b47e79fdf9"
        run: |
          set -euo pipefail
          mkdir -p model
          : > model/training_examples.jsonl
          keys=$(npx wrangler@4 kv key list --namespace-id "$NS_CASES" --prefix "training_example:" | jq -r '.[].name')
          n=0
          for key in $keys; do
            npx wrangler@4 kv key get "$key" --namespace-id "$NS_CASES" >> model/training_examples.jsonl
            printf '\n' >> model/training_examples.jsonl
            n=$((n+1))
          done
          echo "exportados $n TrainingExample a model/training_examples.jsonl"

      - name: Re-entrenar la NN (opcional)
        if: ${{ inputs.retrain }}
        run: |
          set -euo pipefail
          if [ -s model/training_examples.jsonl ]; then
            cargo run -p repair_train --release -- --out model/current.txt --examples model/training_examples.jsonl
          else
            cargo run -p repair_train --release -- --out model/current.txt
          fi

      - name: Preflight (artefacto)
        run: |
          set -euo pipefail
          test -f model/current.txt
          n=$(wc -w < model/current.txt)
          if [ "$n" -ne 2863 ]; then
            echo "::error::model/current.txt tiene $n tokens, se esperan 2863 (WEIGHT_COUNT)"
            exit 1
          fi

      - name: Preflight (secrets)
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::falta el secret $v (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Respaldar current -> model/rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS: ${{ inputs.kv_namespace_id }}
        run: |
          set -euo pipefail
          # BUG-07: guardar el current previo como model/rollback ANTES de
          # sobrescribirlo; sin este paso /model reportaria rollback:
          # "missing" para siempre y no habria vuelta atras.
          if npx wrangler@4 kv key get "model/current" --namespace-id "$NS" > /tmp/current-payload 2>/dev/null; then
            if [ -s /tmp/current-payload ]; then
              npx wrangler@4 kv key put "model/rollback" --namespace-id "$NS" --path /tmp/current-payload
              echo "model/rollback actualizado con el current previo ($(wc -w < /tmp/current-payload) tokens)"
            else
              echo "model/current vacio: nada que respaldar"
            fi
          else
            echo "model/current inexistente (primer promote): nada que respaldar"
          fi

      # PART8 (sin features futuras): el fallback current -> stable -> BLOCKED
      # del worker era teorico: nada escribia model/stable. Con este paso, el
      # current PREVIO (el que ya sirvio produccion real) se promueve a
      # stable bajo decision humana. Nunca el payload nuevo: subir el mismo
      # payload a current y stable anulaba el fallback (BUG-07).
      - name: Promocionar current previo -> model/stable (opcional)
        if: ${{ inputs.promote_stable }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS: ${{ inputs.kv_namespace_id }}
        run: |
          set -euo pipefail
          if [ -s /tmp/current-payload ]; then
            n=$(wc -w < /tmp/current-payload)
            if [ "$n" -ne 2863 ]; then
              echo "::error::el current previo tiene $n tokens, se esperan 2863"
              exit 1
            fi
            npx wrangler@4 kv key put "model/stable" --namespace-id "$NS" --path /tmp/current-payload
            echo "model/stable = current previo (fallback real del worker)"
          else
            echo "sin current previo: nada que promover a stable"
          fi

      - name: Subir payload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS: ${{ inputs.kv_namespace_id }}
          KEYS: ${{ inputs.keys }}
        run: |
          set -euo pipefail
          for key in $KEYS; do
            echo "wrangler kv key put $key -> namespace $NS"
            npx wrangler@4 kv key put "$key" --namespace-id "$NS" --path model/current.txt
          done

      - name: Verificacion (read-back)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS: ${{ inputs.kv_namespace_id }}
          KEYS: ${{ inputs.keys }}
        run: |
          set -euo pipefail
          for key in $KEYS; do
            n=$(npx wrangler@4 kv key get "$key" --namespace-id "$NS" 2>/dev/null | wc -w)
            if [ "$n" -ne 2863 ]; then
              echo "::error::la clave $key devolvio $n tokens, se esperan 2863"
              exit 1
            fi
            echo "$key OK: 2863 tokens"
          done

      # Challenger (candidate.rs): el DO lee NN_WEIGHTS en la clave
      # model/candidate y SOLO reporta metricas; jamas atiende trafico.
      # Subir aqui el mismo payload cierra el flujo champion/challenger sin
      # pasos manuales fuera del workflow de promocion.
      - name: Challenger -> NN_WEIGHTS:model/candidate (opcional)
        if: ${{ inputs.also_candidate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS_CANDIDATE: "3c269e92364f4b59aa83c4388596eefb"
        run: |
          set -euo pipefail
          npx wrangler@4 kv key put "model/candidate" --namespace-id "$NS_CANDIDATE" --path model/current.txt
          n=$(npx wrangler@4 kv key get "model/candidate" --namespace-id "$NS_CANDIDATE" 2>/dev/null | wc -w)
          if [ "$n" -ne 2863 ]; then
            echo "::error::model/candidate devolvio $n tokens, se esperan 2863"
            exit 1
          fi
          echo "model/candidate OK: 2863 tokens (challenger listo; solo reporta)"
