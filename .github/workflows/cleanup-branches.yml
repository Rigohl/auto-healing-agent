name: cleanup-branches (superseded)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE repos/Rigohl/auto-healing-agent/git/refs/heads/feat/llm-distill || true
