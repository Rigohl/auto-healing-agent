name: cleanup-branches (superseded)

# Borra las ramas efimeras ya fusionadas o abandonadas. La politica del repo
# (docs/BRANCH_POLICY.md) exige que solo `main` persiste; este workflow es
# la ejecucion automatica de esa regla. Se dispara manualmente y cada dia.

on:
  # TEMPORAL (revertido tras la limpieza): disparo unico para borrar las 5
  # ramas residuales ya fusionadas/superseded. El cron y dispatch quedan igual.
  push: {}
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate repos/Rigohl/auto-healing-agent/branches?per_page=100 \
            | jq -r '.[].name' \
            | grep -v '^main$' \
            | while read -r branch; do
                echo "deleting ${branch}"
                gh api -X DELETE "repos/Rigohl/auto-healing-agent/git/refs/heads/${branch}" || true
              done
